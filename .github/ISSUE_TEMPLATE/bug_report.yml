name: Bug Report
description: Report a bug in cmux for Linux
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below so we can reproduce and fix it.

  - type: input
    id: cmux-version
    attributes:
      label: cmux version
      description: "Run `cmux --version`, or see the version in the package you installed."
      placeholder: "e.g. 0.2.0"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      description: "e.g. contents of /etc/os-release (PRETTY_NAME)"
      placeholder: "e.g. Ubuntu 24.04.1 LTS"
    validations:
      required: true

  - type: input
    id: session
    attributes:
      label: Desktop and session
      description: "Desktop environment, Wayland or X11 session (echo $XDG_SESSION_TYPE), and GPU driver (Mesa or vendor)."
      placeholder: "e.g. GNOME 46 on Wayland, AMD Radeon with Mesa 24.2"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - AppImage
        - .deb package
        - .rpm package
        - Built from source
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: "A clear description of the bug."
      placeholder: "What happened?"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "Minimal steps to reproduce the bug."
      placeholder: |
        1. Open cmux
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: shell-info
    attributes:
      label: Shell and environment
      description: "Which shell are you using? Any relevant env config (oh-my-zsh, starship, tmux, etc.)?"
      placeholder: "e.g. zsh with starship prompt, using tmux inside cmux"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        If applicable, paste logs. Run cmux from a terminal to see its output, or use `journalctl --user --since "10 min ago" | grep -i cmux`.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: "If applicable, add screenshots or recordings to help explain the problem."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: "Anything else that might be relevant (multiple monitors, HiDPI scaling, accessibility settings, etc.)."
    validations:
      required: false
