name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Ghostty submodule SHA
        id: ghostty
        run: echo "sha=$(git rev-parse HEAD:ghostty)" >> "$GITHUB_OUTPUT"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential pkg-config curl xz-utils \
            libgtk-4-dev libadwaita-1-dev libclang-dev clang \
            libfontconfig-dev libfreetype-dev libgl-dev libegl-dev \
            libonig-dev libbz2-dev \
            rpm desktop-file-utils appstream shellcheck

      - name: Lint shell scripts
        run: shellcheck -x -P SCRIPTDIR scripts/*.sh packaging/scripts/*.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/remote/go.mod
          cache-dependency-path: daemon/remote/go.sum

      - name: Cache libghostty build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/zig
            ghostty/zig-out
          key: ghostty-${{ runner.os }}-${{ steps.ghostty.outputs.sha }}

      - name: Set up Zig and build libghostty
        # Installs Zig 0.15.2 (SHA-256 verified) and builds libghostty; system packages are above.
        run: |
          scripts/setup-linux.sh --no-deps
          # Later steps (terminfo generation in the packagers) run zig too.
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Add clippy
        run: rustup component add clippy

      - name: Clippy (non-blocking until existing warnings are fixed)
        continue-on-error: true
        run: cargo clippy --bins -- -D warnings

      - name: Unit tests
        run: cargo test --bins

      - name: Build release binaries
        run: cargo build --release --bin cmux-app --bin cmux

      - name: Remote daemon tests
        working-directory: daemon/remote
        run: go test ./...

      - name: Build cmuxd-remote
        working-directory: daemon/remote
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o cmuxd-remote ./cmd/cmuxd-remote

      - name: Remote daemon release asset check
        run: tests/test_remote_daemon_release_assets.sh

      - name: Desktop metadata checks
        run: packaging/scripts/validate-all.sh

      - name: Build .deb
        run: packaging/scripts/build-deb.sh

      - name: Validate .deb
        run: packaging/scripts/validate-deb.sh

      - name: Build .rpm
        run: packaging/scripts/build-rpm.sh

      - name: Validate .rpm
        run: packaging/scripts/validate-rpm.sh

      - name: Build AppImage
        run: packaging/scripts/build-appimage.sh

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cmux-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cmux-packages
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum ./* | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "cmux $GITHUB_REF_NAME" \
            --generate-notes
