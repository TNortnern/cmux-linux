[package]
name = "cmux-linux"
version = "0.2.2"
edition = "2021"
description = "GPU-accelerated terminal multiplexer for Linux (GTK4 + Ghostty)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TNortnern/cmux-linux"
readme = "README.md"
publish = false

[[bin]]
name = "cmux-app"
path = "src/main.rs"

[[bin]]
name = "cmux"
path = "src/bin/cmux.rs"

[dependencies]
gtk4 = { version = "0.10.3", features = ["v4_6"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "process", "io-util"] }
glib = "0.21.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
base64 = "0.22.1"
# Plain ws:// only (browser stream is 127.0.0.1); no TLS stack compiled in.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[[bin]]
name = "cmux-generate"
path = "src/bin/generate.rs"

[dev-dependencies]
# #[tokio::test] only; the app itself builds without tokio's macros.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.57"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = "line-tables-only"
# Unwinding is the default, but state it: tokio catches panics in spawned tasks
# and turns them into JoinError, which only works when panics unwind.
panic = "unwind"
